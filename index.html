<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>部门能力地图｜Division Projection v7.4</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root{
      --orange: rgb(255,127,0);
      --white: rgb(244,255,255);
      --red: rgb(255,48,0);
      --green: rgb(140,200,60);
      --cyan: rgb(71,230,220);
      --bg: #030507;
      --text: rgba(244,255,255,.94);
      --text-soft: rgba(244,255,255,.58);
      --text-dim: rgba(244,255,255,.28);
    }
    *{ box-sizing:border-box; }
    html, body{
      margin:0; width:100%; height:100%; overflow:hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body::before, body::after{
      content:""; position:fixed; inset:0; pointer-events:none;
    }
    body::before{
      z-index:0;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(255,127,0,.08), transparent 28%),
        radial-gradient(ellipse at 60% 28%, rgba(244,255,255,.06), transparent 16%),
        linear-gradient(135deg, #020305 0%, #071015 52%, #030507 100%);
    }
    body::after{
      z-index:1;
      opacity:.32;
      background-image:
        linear-gradient(rgba(244,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244,255,255,.022) 1px, transparent 1px),
        linear-gradient(rgba(255,127,0,.020) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,127,0,.020) 1px, transparent 1px);
      background-size: 90px 90px, 90px 90px, 18px 18px, 18px 18px;
      mask-image: radial-gradient(circle at center, black 0, black 62%, transparent 98%);
    }

    #app{
      position:relative; z-index:2;
      width:100vw; height:100vh; min-height:680px; overflow:hidden;
    }
    .stage{
      position:absolute; inset:14px;
      overflow:hidden;
      border:1px solid rgba(244,255,255,.075);
      background:
        linear-gradient(180deg, rgba(244,255,255,.018), rgba(244,255,255,.004)),
        radial-gradient(ellipse at 50% 52%, rgba(255,127,0,.024), transparent 45%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.012),
        inset 0 0 120px rgba(255,127,0,.012),
        0 26px 80px rgba(0,0,0,.55);
    }
    .stage::before{
      content:""; position:absolute; inset:0; z-index:4; pointer-events:none;
      opacity:.08;
      background: repeating-linear-gradient(
        0deg,
        rgba(244,255,255,.03) 0,
        rgba(244,255,255,.03) 1px,
        transparent 1px,
        transparent 8px
      );
    }

    svg{
      position:relative; z-index:3;
      width:100%; height:100%; display:block;
    }

    /* top ui */
    .top-ui{
      position:absolute; top:22px; left:28px; z-index:10; pointer-events:none;
    }
    .top-row{
      display:flex; align-items:center; gap:9px; margin-bottom:14px;
    }
    .glyph{
      width:33px; height:33px; display:grid; place-items:center;
      border:1px solid rgba(244,255,255,.10);
      background: rgba(5,8,10,.55);
      color: rgba(244,255,255,.58);
      backdrop-filter: blur(8px);
      font-size:15px;
    }
    .glyph.active{
      background: var(--orange); border-color: var(--orange); color:#121416;
    }
    .home-title{
      margin-left:8px; display:flex; align-items:center; gap:12px;
      color: rgba(244,255,255,.90); font-size:23px; font-weight:300; letter-spacing:.15em;
    }
    .home-title::before, .home-title::after{
      content:""; width:1px; height:26px; background: rgba(244,255,255,.20);
    }
    .section{
      display:flex; align-items:center; gap:14px;
    }
    .section-code{
      height:38px; padding:0 14px; display:grid; place-items:center;
      background: var(--orange); color:#fff; font-size:21px; font-weight:300; letter-spacing:.08em;
    }
    .section-name{
      color: rgba(242,196,67,.95); font-size:28px; font-weight:300; letter-spacing:.08em;
    }
    .section-sub{
      margin-top:8px; margin-left:4px;
      color: rgba(244,255,255,.38); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    }

    /* right readout */
    .readout{
      position:absolute; right:24px; top:88px; width:286px; z-index:9;
      display:grid; gap:10px; pointer-events:none;
    }
    .panel{
      padding:12px 13px 13px;
      background: rgba(244,255,255,.055);
      border:1px solid rgba(244,255,255,.12);
      backdrop-filter: blur(12px);
      box-shadow: inset 0 0 0 1px rgba(244,255,255,.02);
      position:relative;
    }
    .panel::before{
      content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
      background: var(--orange); opacity:.85;
    }
    .panel-top{
      display:flex; justify-content:space-between; align-items:center; gap:8px;
      color: rgba(244,255,255,.45); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    }
    .panel-code{
      color: var(--orange); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:11px; letter-spacing:.10em;
    }
    .panel-title{
      margin:7px 0 2px; font-size:22px; font-weight:300; color: var(--white); letter-spacing:.06em;
    }
    .panel-subtitle{
      color: rgba(255,206,140,.86); font-size:11px; letter-spacing:.08em;
    }
    .panel-text{
      margin:10px 0 0; color: rgba(244,255,255,.56); font-size:12px; line-height:1.55;
    }
    .metric-grid{
      display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:8px; margin-top:10px;
    }
    .metric{
      min-height:49px; padding:8px 9px;
      background: rgba(6,10,12,.22); border:1px solid rgba(244,255,255,.09);
    }
    .metric .num{
      font-size:22px; line-height:1; font-weight:300; color: var(--white);
    }
    .metric .txt{
      margin-top:5px; color: rgba(244,255,255,.42); font-size:9px; letter-spacing:.10em; text-transform:uppercase;
    }

    /* bottom controls */
    .mode-bar{
      position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
      z-index:11; display:flex; gap:8px; padding:7px 9px;
      border:1px solid rgba(244,255,255,.12);
      background: rgba(5,8,10,.48);
      backdrop-filter: blur(12px);
    }
    .mode-btn{
      height:28px; padding:0 10px;
      border:1px solid rgba(244,255,255,.12);
      background: rgba(244,255,255,.04);
      color: rgba(244,255,255,.58);
      font-size:10px; letter-spacing:.10em; cursor:pointer;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .mode-btn:hover{ color:#fff; border-color: rgba(255,127,0,.42); }
    .mode-btn.active{ color:#101214; background: var(--orange); border-color: var(--orange); }

    .hint{
      position:absolute; right:30px; bottom:26px; z-index:10; pointer-events:none;
      color: rgba(244,255,255,.40); font-size:10px; letter-spacing:.10em; text-transform:uppercase;
    }

    /* background */
    .bg-topo{ opacity:.22; }
    .bg-area{
      fill: rgba(244,255,255,.010);
      stroke: rgba(244,255,255,.04);
      stroke-width:.8;
    }
    .bg-area.orange{
      fill: rgba(255,127,0,.016);
      stroke: rgba(255,127,0,.08);
    }
    .bg-line{
      fill:none; stroke: rgba(244,255,255,.08); stroke-width:.85;
      stroke-linecap:round; stroke-linejoin:round; opacity:.42;
    }
    .bg-line.road{ stroke: rgba(244,255,255,.15); stroke-width:1.0; opacity:.48; }
    .bg-line.orange{ stroke: rgba(255,127,0,.13); stroke-width:.95; opacity:.35; }
    .bg-line.faint{ stroke: rgba(244,255,255,.035); stroke-width:.72; opacity:.32; }
    .vol-body{
      fill: rgba(244,255,255,.012);
      stroke: rgba(244,255,255,.052);
      stroke-width:.65;
      opacity:.30;
    }
    .vol-top{
      fill: rgba(244,255,255,.026);
      stroke: rgba(244,255,255,.060);
      stroke-width:.65;
      opacity:.32;
    }
    .vol-highlight{
      fill: rgba(255,127,0,.014);
      stroke: rgba(255,127,0,.070);
      stroke-width:.70;
      opacity:.30;
    }
    .zone-label{
      fill: rgba(244,255,255,.18);
      font-size:11px; letter-spacing:.11em;
      pointer-events:none;
    }
    .zone-label.orange{ fill: rgba(255,127,0,.42); }

    /* routes */
    .route path{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .route-bg{ stroke: rgba(244,255,255,.030); stroke-width:3.2; opacity:.40; }
    .route-ghost{ stroke: rgba(244,255,255,.24); stroke-width:.72; opacity:.58; }
    .route-main{ stroke: rgba(255,127,0,.12); stroke-width:.55; opacity:.22; }
    .route-flow{
      stroke: rgba(255,205,140,.92); stroke-width:.82;
      stroke-dasharray: 4 18;
      animation: routeFlow 1.2s linear infinite;
      filter:url(#strongGlow);
      opacity:0;
    }
    .route-beam{
      stroke: rgba(255,127,0,.10); stroke-width:2.4; opacity:0; filter:url(#softGlow);
    }
    .route.primary.visible .route-ghost,
    .route.primary.visible .route-main{
      opacity:.62;
    }
    .route.connected .route-main{
      stroke: rgba(255,127,0,.76);
      stroke-width:1.1;
      stroke-dasharray: 8 12;
      animation: routePulse 2.5s linear infinite;
      opacity:1;
      filter:url(#softGlow);
    }
    .route.connected .route-flow,
    .route.connected .route-beam{ opacity:.95; }
    .route.hidden{ opacity:0; pointer-events:none; }
    .route.dim{ opacity:.08; }

    @keyframes routePulse{ from { stroke-dashoffset: 70; } to { stroke-dashoffset: 0; } }
    @keyframes routeFlow{ from { stroke-dashoffset: 50; } to { stroke-dashoffset: 0; } }

    .route-label path{
      fill: rgba(244,255,255,.034);
      stroke: rgba(244,255,255,.11);
      stroke-width:.7;
    }
    .route-label text{
      fill: rgba(244,255,255,.48);
      font-size:9px; font-weight:600; letter-spacing:.10em;
      text-anchor:middle; dominant-baseline:central; pointer-events:none;
    }
    .route-label .accent{
      fill: rgba(255,127,0,.56); opacity:.34;
    }
    .route-label.visible{ opacity:.62; }
    .route-label.connected{ opacity:1; }
    .route-label.connected path{
      fill: rgba(255,127,0,.13);
      stroke: rgba(255,127,0,.48);
      filter:url(#softGlow);
    }
    .route-label.connected text{ fill: rgba(244,255,255,.95); }
    .route-label.connected .accent{ opacity:1; filter:url(#softGlow); }
    .route-label.hidden{ opacity:0; pointer-events:none; }

    .particle-dot, .particle-white, .particle-arrow{
      pointer-events:none; opacity:0;
    }
    .particle-dot{ fill: rgba(255,150,64,.96); filter:url(#strongGlow); }
    .particle-white{ fill: rgba(244,255,255,.92); filter:url(#softGlow); }
    .particle-arrow{ fill: rgba(255,205,140,.96); filter:url(#softGlow); }

    /* node anchors - unified */
    .marker{ cursor:pointer; }
    .anchor-core{
      fill: var(--orange);
      filter:url(#softGlow);
    }
    .anchor-frame, .anchor-ticks, .anchor-aux{
      fill:none; vector-effect:non-scaling-stroke; stroke-width:1;
    }
    .anchor-frame{ stroke: rgba(244,255,255,.34); opacity:.60; }
    .anchor-ticks{ stroke: rgba(244,255,255,.82); opacity:.82; }
    .anchor-aux{ stroke: rgba(255,127,0,.24); opacity:.32; stroke-dasharray:3 6; }
    .marker.selected .anchor-core{ fill: var(--white); filter:none; }
    .marker.selected .anchor-frame,
    .marker.related .anchor-frame{
      stroke: rgba(255,127,0,.82); opacity:1; filter:url(#softGlow);
    }
    .marker.selected .anchor-ticks,
    .marker.related .anchor-ticks{
      stroke: rgba(244,255,255,.96); opacity:1;
    }
    .marker.dimmed{ opacity:.26; }

    /* callouts */
    .callout-stem{
      stroke: rgba(244,255,255,.12); stroke-width:.62; fill:none;
    }
    .callout-panel{
      fill: rgba(9,13,17,.14);
      stroke: rgba(244,255,255,.042);
      stroke-width:.52;
      filter:url(#glassShadow);
      transition: opacity .16s ease;
    }
    .callout-topline{
      stroke: rgba(255,127,0,.16);
      stroke-width:.62;
      transition: opacity .16s ease;
    }
    .callout-accent{
      stroke: rgba(255,127,0,.30);
      stroke-width:1.2;
      fill:none;
      opacity:.42;
      transition: opacity .16s ease;
    }
    .marker .callout-select-glow,
    .marker .callout-select-corner{
      opacity:0;
      pointer-events:none;
      transition: opacity .16s ease;
    }
    .marker.selected .callout-panel{
      fill: rgba(12,17,21,.24);
      stroke: rgba(244,255,255,.13);
      stroke-width:.78;
      filter:url(#selectedModuleGlow);
    }
    .marker.selected .callout-topline{
      stroke: rgba(255,127,0,.54);
      stroke-width:.92;
      filter:url(#softGlow);
    }
    .marker.selected .callout-accent{
      stroke: rgba(255,127,0,.80);
      stroke-width:1.55;
      opacity:.92;
      filter:url(#softGlow);
    }
    .marker.selected .callout-select-glow{
      opacity:.78;
      filter:url(#selectedModuleGlow);
    }
    .marker.selected .callout-select-corner{
      opacity:.95;
      filter:url(#softGlow);
    }
    .marker.selected .node-code{
      fill: rgba(255,159,58,.96);
      filter:url(#softGlow);
    }
    .marker.selected .node-title{
      fill: rgba(244,255,255,1);
      stroke-width:3.4px;
    }
    .marker.selected .node-subtitle{
      fill: rgba(255,222,168,.98);
    }
    .marker.related .callout-panel{
      stroke: rgba(255,127,0,.10);
      fill: rgba(9,13,17,.18);
    }
    .marker.dimmed .callout{
      opacity:.46;
    }
    .node-code{
      fill: rgba(255,127,0,.74);
      font-size:10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing:.08em;
      text-anchor:middle;
      dominant-baseline:central;
    }
    .node-title{
      fill: var(--white);
      font-size:16px;
      font-weight:650;
      letter-spacing:.05em;
      text-anchor:middle;
      dominant-baseline:central;
      paint-order: stroke;
      stroke: rgba(0,0,0,.50);
      stroke-width:3px;
      stroke-linejoin:round;
    }
    .node-subtitle{
      fill: rgba(255,205,140,.84);
      font-size:9.5px;
      font-weight:600;
      letter-spacing:.07em;
      text-anchor:middle;
      dominant-baseline:central;
    }
    .node-icon{
      fill:none;
      stroke: rgba(255,160,72,.30);
      stroke-width:.72;
      stroke-linecap:round; stroke-linejoin:round;
      filter:none;
      opacity:.26;
    }
    .node-icon-dot{
      fill: rgba(255,160,72,.035);
      stroke: rgba(255,160,72,.28);
      stroke-width:.62;
      filter:none;
      opacity:.30;
    }
    .marker.major .node-title{ font-size:22px; }
    .marker.major .node-subtitle{ font-size:11px; }

    /* behavior mode / stable HUD */
    .behavior-layer{ pointer-events:none; }
    .behavior-group{ opacity:0; transition:opacity .18s ease; }
    .mode-behavior .behavior-group{ opacity:.64; }
    .behavior-line{
      fill:none;
      stroke: rgba(244,255,255,.42);
      stroke-width:.72;
      vector-effect:non-scaling-stroke;
    }
    .behavior-line.orange{ stroke: rgba(255,127,0,.50); }
    .behavior-ring{
      fill:none;
      stroke: rgba(244,255,255,.15);
      stroke-width:.82;
      vector-effect:non-scaling-stroke;
    }
    .behavior-ring.orange{
      stroke: rgba(255,127,0,.34);
      filter:none;
    }
    .behavior-arc{
      fill:none;
      stroke: rgba(255,205,140,.62);
      stroke-width:3.2;
      stroke-linecap:round;
      filter:none;
    }
    .behavior-tick{
      stroke: rgba(244,255,255,.42);
      stroke-width:1;
      vector-effect:non-scaling-stroke;
    }
    .behavior-label{
      fill: rgba(244,255,255,.70);
      font-size:11px;
      letter-spacing:.02em;
    }
    .behavior-small{
      fill: rgba(244,255,255,.48);
      font-size:9px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .behavior-metertext{
      fill: rgba(244,255,255,.76);
      font-size:14px;
      font-weight:600;
      text-anchor:middle;
    }
    .behavior-square{
      fill: var(--orange);
      filter:none;
      opacity:.82;
    }
    .behavior-square.white{
      fill: var(--white);
      filter:none;
      opacity:.78;
    }
    .behavior-link-node{
      fill: rgba(244,255,255,.72);
      stroke: rgba(255,127,0,.40);
      stroke-width:1;
      filter:none;
    }

    /* mode helpers */
    .mode-minimal .readout,
    .mode-minimal .section-sub,
    .mode-minimal .hint{
      opacity:0; pointer-events:none;
    }
    .mode-map .readout,
    .mode-map .hint{
      opacity:0; pointer-events:none;
    }
    .mode-map .callout-panel,
    .mode-map .callout-accent,
    .mode-map .callout-topline,
    .mode-map .node-title,
    .mode-map .node-subtitle,
    .mode-map .node-code,
    .mode-map .node-icon{
      opacity:.12;
    }
    .mode-map .marker.selected .callout-panel,
    .mode-map .marker.selected .callout-accent,
    .mode-map .marker.selected .callout-topline,
    .mode-map .marker.selected .node-title,
    .mode-map .marker.selected .node-subtitle,
    .mode-map .marker.selected .node-code,
    .mode-map .marker.selected .node-icon{
      opacity:1;
    }
    .mode-behavior .readout{
      opacity:.10;
    }
    .mode-capture .top-ui,
    .mode-capture .readout,
    .mode-capture .mode-bar,
    .mode-capture .hint{
      display:none !important;
    }
    .mode-capture .stage{ inset:0; border:0; }

    @media (max-width: 1100px){
      .readout{ width:250px; }
      .panel-title{ font-size:19px; }
      .section-name{ font-size:24px; }
    }
    @media (max-width: 860px){
      #app{ min-height:720px; }
      .stage{ inset:8px; }
      .readout, .hint{ display:none; }
      .top-ui{ left:18px; top:16px; transform:scale(.88); transform-origin:left top; }
      .mode-bar{ transform:translateX(-50%) scale(.86); bottom:12px; }
      .mode-btn{ padding:0 7px; font-size:9px; }
    }
  </style>
</head>
<body>
  <div id="app" class="mode-standard">
    <main class="stage">
      <div class="top-ui">
        <div class="top-row">
          <span class="glyph">Q</span>
          <span class="glyph active">⌂</span>
          <span class="glyph">⚙</span>
          <span class="glyph">↵</span>
          <div class="home-title">首页</div>
        </div>
        <div class="section">
          <div class="section-code">01. CORE</div>
          <div class="section-name">部门能力地图</div>
        </div>
        <div class="section-sub">GEOLOGICAL DATA · MODEL · AI DECISION · DELIVERY TERMINAL</div>
      </div>

      <svg id="graph" role="img" aria-label="部门能力地图 V7.4"></svg>

      <aside class="readout" aria-label="当前节点状态">
        <section class="panel">
          <div class="panel-top"><span>Selected Node</span><span class="panel-code" id="panelCode">CORE-00</span></div>
          <h2 class="panel-title" id="panelTitle">信息化平台</h2>
          <div class="panel-subtitle" id="panelSubtitle">流程 · 数据 · 协同</div>
          <div class="panel-text" id="panelText">作为部门能力体系的中枢，将项目数据、技术流程、质量审查和经营管理统一到可视化平台中。</div>
        </section>
        <section class="panel">
          <div class="panel-top"><span>Status</span><span class="panel-code" id="panelStatus">ONLINE</span></div>
          <div class="metric-grid">
            <div class="metric"><div class="num" id="metricLevel">07</div><div class="txt">LEVEL</div></div>
            <div class="metric"><div class="num" id="metricHealth">98</div><div class="txt">HEALTH</div></div>
            <div class="metric"><div class="num" id="metricLinks">4</div><div class="txt">LINKS</div></div>
            <div class="metric"><div class="num" id="metricRisk">LOW</div><div class="txt">RISK</div></div>
          </div>
        </section>
      </aside>

      <nav class="mode-bar" aria-label="显示模式">
        <button class="mode-btn active" data-mode="standard">STANDARD</button>
        <button class="mode-btn" data-mode="behavior">BEHAVIOR</button>
        <button class="mode-btn" data-mode="map">MAP</button>
        <button class="mode-btn" data-mode="minimal">MINIMAL</button>
        <button class="mode-btn" data-mode="capture">CAPTURE</button>
      </nav>

      <div class="hint">选中模块加入边缘微光 · 图标微符号化 · BEHAVIOR 为辅助诊断层</div>
    </main>
  </div>

  <script>
    const app = document.querySelector('#app');
    const stage = document.querySelector('.stage');
    const svg = d3.select('#graph');
    const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));

    let width = stage.clientWidth;
    let height = stage.clientHeight;
    let currentMode = 'standard';
    let selectedNodeId = 'platform';

    svg.attr('viewBox', [0,0,width,height]);

    const defs = svg.append('defs');

    const softGlow = defs.append('filter').attr('id','softGlow').attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%');
    softGlow.append('feGaussianBlur').attr('stdDeviation',2.4).attr('result','blur');
    softGlow.append('feColorMatrix')
      .attr('in','blur').attr('type','matrix')
      .attr('values','1 0 0 0 0.96  0 0.56 0 0 0.28  0 0 0.12 0 0.02  0 0 0 0.74 0')
      .attr('result','orangeBlur');
    let merge = softGlow.append('feMerge');
    merge.append('feMergeNode').attr('in','orangeBlur');

    function calloutPath(w,h,c=8){
      const hw = w/2, hh = h/2;
      return `M${-hw+c},${-hh} L${hw-c},${-hh} L${hw},${-hh+c} L${hw},${hh-c} L${hw-c},${hh} L${-hw+c},${hh} L${-hw},${hh-c} L${-hw},${-hh+c} Z`;
    }
    function stripPath(w=76,h=20,c=3){

      return `M${-hw+c},${-hh} L${hw},${-hh} L${hw-c},${hh} L${-hw},${hh} Z`;
    }
    function edgePoint(a,b,extra=0){
      const dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.max(Math.hypot(dx,dy), 1);
      const r = (a.r || 12) + extra;
      return { x: a.x + dx/len*r, y: a.y + dy/len*r };
    }
    function routePoints(d){
      const s = nodeById.get(d.source), t = nodeById.get(d.target);
      const start = edgePoint(s,t,4), end = edgePoint(t,s,4);
      return [[start.x,start.y], ...d.bends.map(rel), [end.x,end.y]];
    }
    function routePath(d){ return smoothLine(routePoints(d)); }

      return { x:m[0], y:m[1] };

        let angle = Math.atan2(b[1]-a[1], b[0]-a[0]) * 180 / Math.PI;
        if(angle > 90) angle -= 180;
        if(angle < -90) angle += 180;
        return `translate(${m.x},${m.y}) rotate(${angle})`;

      for(let i=0;i<28;i++){
        const a = Math.PI * 2 * i / 28 - Math.PI/2;
        const r1 = 49, r2 = (i % 4 === 0) ? 55 : 52;
        main.append('line')
          .attr('class','behavior-tick')

      const top = behaviorGroup.append('g').attr('transform', `translate(${topX},${topY})`);
      top.append('rect').attr('class','behavior-square').attr('x', -6).attr('y', -6).attr('width', 12).attr('height', 12);
      top.append('path').attr('class','behavior-line').attr('d', 'M-18,0 H-9 M9,0 H18 M0,-18 V-9 M0,9 V18');
      top.append('text').attr('class','behavior-small').attr('x', -6).attr('y', -24).attr('text-anchor', 'end').text('RADIUS');
      top.append('text').attr('class','behavior-label').attr('x', 18).attr('y', 6).text('联动半径');
      top.append('text').attr('class','behavior-small').attr('x', -6).attr('y', -36).attr('text-anchor', 'end').text(`${Math.max(70, Math.round(n.health * 0.78))}%`);

      // bottom small widget
      behaviorGroup.append('line').attr('class','behavior-line').attr('x1', mainX - 22).attr('y1', mainY + 42).attr('x2', botX + 20).attr('y2', botY - 18);
      const bot = behaviorGroup.append('g').attr('transform', `translate(${botX},${botY})`);
      bot.append('circle').attr('class','behavior-ring').attr('r', 20);
      bot.append('circle').attr('class','behavior-ring orange').attr('r', 12);
      bot.append('rect').attr('class','behavior-square white').attr('x', -4).attr('y', -4).attr('width', 8).attr('height', 8);
      const links = routes.filter(r => r.source === n.id || r.target === n.id).length;
      bot.append('text').attr('class','behavior-small').attr('x', 0).attr('y', 34).attr('text-anchor', 'middle').text('LINKS');
      bot.append('text').attr('class','behavior-label').attr('x', 0).attr('y', 49).attr('text-anchor', 'middle').text(`${links} / Distance Range`);

      // right info block
      behaviorGroup.append('line').attr('class','behavior-line').attr('x1', mainX + 26).attr('y1', mainY - 34).attr('x2', infoX - 26).attr('y2', infoY + 22);
      const info = behaviorGroup.append('g').attr('transform', `translate(${infoX},${infoY})`);
      info.append('circle').attr('class','behavior-ring orange').attr('r', 28);
      info.append('circle').attr('class','behavior-ring').attr('r', 17);
      info.append('rect').attr('class','behavior-square').attr('x', -4).attr('y', -4).attr('width', 8).attr('height', 8);
      info.append('text').attr('class','behavior-small').attr('x', 38).attr('y', -9).text('STATUS');
      info.append('text').attr('class','behavior-label').attr('x', 38).attr('y', 7).text('Health / Risk');
      info.append('text').attr('class','behavior-small').attr('x', 38).attr('y', 24).text(`${n.status} · ${n.risk}`);

      // tidy labels around hub
      behaviorGroup.append('text').attr('class','behavior-small').attr('x', mainX - 64).attr('y', mainY - 82).text('DISTANCE RANGE');
      behaviorGroup.append('text').attr('class','behavior-small').attr('x', mainX + 38).attr('y', mainY + 90).text('ANGULAR ROTATION');
      behaviorGroup.append('text').attr('class','behavior-small').attr('x', mainX - 6).attr('y', mainY - 104).attr('text-anchor', 'middle').text(`${n.code} / ${n.title}`);
    }

    function applyState(){
      routeGroups
        .classed('visible', d => shouldShowRoute(d))
        .classed('connected', d => isConnected(d))
        .classed('hidden', d => !shouldShowRoute(d))
        .classed('dim', d => selectedNodeId && shouldShowRoute(d) && !isConnected(d) && !d.primary);

      routeLabels
        .classed('visible', d => shouldShowRoute(d))
        .classed('connected', d => isConnected(d))
        .classed('hidden', d => !shouldShowRoute(d));

      marker
        .classed('selected', d => d.id === selectedNodeId)
        .classed('related', d => selectedNodeId && d.id !== selectedNodeId && nodeRelated(d.id))
        .classed('dimmed', d => selectedNodeId && d.id !== selectedNodeId && !nodeRelated(d.id));

      particles.transition().duration(160).attr('opacity', p => isConnected(p.route) ? 1 : 0);
      arrows.transition().duration(160).attr('opacity', p => isConnected(p.route) ? .9 : 0);

      updatePanel();
      renderBehavior();
    }

    function renderAll(){
      renderMarkers();
      renderRoutes();
      applyState();
    }
    renderAll();

    function routeMainPathEl(routeId){
      const idx = routes.findIndex(r => r.id === routeId);
      return routeGroups.nodes()[idx].querySelector('.route-main');
    }

    d3.timer(() => {
      const now = performance.now() / 1000;

      particles.each(function(p){
        if(!isConnected(p.route)) return;
        const el = routeMainPathEl(p.route.id);
        if(!el) return;
        let len = 1;
        try { len = el.getTotalLength(); } catch(e) { len = 1; }
        const travel = (now * p.speed + p.offset * len) % len;
        const pt = el.getPointAtLength(travel);
        d3.select(this).attr('cx', pt.x).attr('cy', pt.y);
      });

      arrows.each(function(p){
        if(!isConnected(p.route)) return;
        const el = routeMainPathEl(p.route.id);
        if(!el) return;
        let len = 1;
        try { len = el.getTotalLength(); } catch(e) { len = 1; }
        const travel = (now * p.speed + p.offset * len) % len;
        const pt = el.getPointAtLength(travel);
        const pt2 = el.getPointAtLength(Math.min(travel + 1.2, len));
        const angle = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 180 / Math.PI;
        d3.select(this).attr('transform', `translate(${pt.x},${pt.y}) rotate(${angle})`);
      });
    });

    marker.on('click', function(event, d){
      event.stopPropagation();
      selectedNodeId = selectedNodeId === d.id ? null : d.id;
      d3.select(this).raise();
      applyState();
    });

    svg.on('click', function(event){
      if(event.target.closest && event.target.closest('.marker')) return;
      selectedNodeId = null;
      applyState();
    });

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;
        app.className = `mode-${currentMode}`;
        modeButtons.forEach(b => b.classList.toggle('active', b === btn));
        if(currentMode === 'behavior' && !selectedNodeId) selectedNodeId = 'platform';
        applyState();
      });
    });

    document.addEventListener('keydown', event => {
      if(event.key === 'Escape'){
        selectedNodeId = null;
        applyState();
      }
      if(event.key.toLowerCase() === 'v'){
        const modes = ['standard','behavior','map','minimal','capture'];
        const idx = modes.indexOf(currentMode);
        currentMode = modes[(idx + 1) % modes.length];
        app.className = `mode-${currentMode}`;
        modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
        if(currentMode === 'behavior' && !selectedNodeId) selectedNodeId = 'platform';
        applyState();
      }
    });

    function dragStarted(event, d){
      d.dragged = true;
      d3.select(this).raise();
    }
    function dragged(event, d){
      d.x = Math.max(68, Math.min(width - 68, event.x));
      d.y = Math.max(76, Math.min(height - 70, event.y));
      renderAll();
    }
    function dragEnded(event, d){
      d.rx = d.x / width;
      d.ry = d.y / height;
    }

    function drawIcon(g, type, scale=1){
      g.attr('transform', `scale(${scale})`);
      if(type === 'platform'){
        drawPath(g, 'M-18,-10 L0,-18 L18,-10 L0,-2 Z M-18,1 L0,-7 L18,1 L0,9 Z M-18,12 L0,4 L18,12 L0,20 Z');
        drawDots(g, [[-24,-11],[24,-11],[0,-24],[24,12],[-24,12]]);
      } else if(type === 'data'){
        drawPath(g, 'M-18,-18 H18 L24,-10 V10 L18,18 H-18 L-24,10 V-10 Z M-12,-7 H12 M-12,0 H12 M-12,7 H8');
      } else if(type === 'model'){
        drawPath(g, 'M-26,18 L-16,2 L-6,10 L3,-12 L14,3 L25,-18 L34,18 Z M-20,10 C-7,4 8,8 26,4');
      } else if(type === 'geo'){
        drawPath(g, 'M-28,18 L-18,0 L-8,11 L3,-8 L16,18 Z M8,-24 L24,-8 M20,-18 L12,-10 M-4,15 L26,15');
        drawPath(g, 'M14,-24 L25,-16 L2,7 L-6,0 Z');
      } else if(type === 'ai'){
        drawPath(g, 'M-15,-16 C-24,-12 -24,2 -14,7 C-20,18 -3,25 2,15 C12,25 25,14 17,4 C27,-6 16,-20 4,-13 C0,-24 -15,-24 -15,-16 Z');
        drawPath(g, 'M-10,-1 H9 M0,-10 V15 M-6,9 L8,-5');
        drawDots(g, [[-10,-1],[9,-1],[0,-10],[0,15],[-6,9],[8,-5]]);
      } else if(type === 'delivery'){
        drawPath(g, 'M-20,-22 H10 L22,-10 V22 H-20 Z M10,-22 V-10 H22 M-12,-2 H12 M-12,6 H12 M-12,14 H5');
      }
    }
    function drawPath(g, d){
      g.append('path').attr('class', 'node-icon').attr('d', d);
    }
    function drawDots(g, pts){
      pts.forEach(([x,y]) => {
        g.append('circle').attr('class','node-icon-dot').attr('cx', x).attr('cy', y).attr('r', 2);
      });
    }

    function resize(){
      width = stage.clientWidth;
      height = stage.clientHeight;
      svg.attr('viewBox', [0,0,width,height]);
      bgLayer.select('.bg-topo').attr('width', width).attr('height', height);
      nodes.forEach(d => {
        d.x = width * d.rx;
        d.y = height * d.ry;
      });
      drawBackground();
      renderAll();
    }

    window.addEventListener('resize', resize);
  </script>
</body>
</html>
